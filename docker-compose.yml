# `docker compose up --build` starts everything; no other steps needed.
# Startup order: db + redis -> setup (migrate, seed, admin user; then exits) -> web, worker, beat.
# Uploaded files live in backend/media/ on your machine (mounted into the containers).

x-backend: &backend
  build: ./backend
  image: junction-backend
  env_file:
    - path: .env
      required: false  # works on a fresh clone; copy .env.example to .env to customise
  environment: &backend-env
    DATABASE_URL: postgres://junction:junction@db:5432/junction
    REDIS_URL: redis://redis:6379/0
    # In Docker, tasks go to the real Celery worker, whatever .env says.
    CELERY_TASK_ALWAYS_EAGER: "False"
    DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
    # Where LLM_PROVIDER=ollama finds Ollama (the service below) unless LLM_BASE_URL says otherwise.
    OLLAMA_HOST: http://ollama:11434
  volumes: [./backend:/app]
  # Lets containers reach services on your computer, e.g. LLM_BASE_URL=http://host.docker.internal:11434
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: junction
      POSTGRES_USER: junction
      POSTGRES_PASSWORD: junction
    # Host port 5433 avoids clashing with a local Postgres; containers use db:5432.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junction -d junction"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  setup:
    <<: *backend
    command: python manage.py bootstrap
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: celery -A config worker -l info
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  beat:
    <<: *backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  # Local LLMs (LLM_PROVIDER=ollama). Started when .env has COMPOSE_PROFILES=ollama.
  # Download a model once:  docker compose exec ollama ollama pull qwen3:8b
  ollama:
    image: ollama/ollama:latest
    profiles: [ollama]
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    # NVIDIA GPU (needs the NVIDIA Container Toolkit): uncomment the next 6 lines.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: [gpu]

volumes:
  pgdata:
  ollama:
