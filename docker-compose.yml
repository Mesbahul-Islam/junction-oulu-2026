# `docker compose up --build` starts everything; no other steps needed.
# Startup order: db + redis -> setup -> web, worker, beat.
# `setup` runs `manage.py bootstrap` once and exits: migrations, demo data (Oulu community,
# Kaleva feeds, markets, demo users) and, on the first start only, the Liiga season +
# Fantasy Liiga demo managers (needs internet; set SEED_FANTASY=false in .env to skip).
# The other services wait for it, so the app always starts on a migrated, seeded database.
# Uploaded files live in backend/media/ on your machine (mounted into the containers).

x-backend: &backend
  build: ./backend
  image: junction-backend
  env_file:
    - path: .env
      required: false  # works on a fresh clone; copy .env.example to .env to customise
  environment: &backend-env
    DATABASE_URL: postgres://junction:junction@db:5432/junction
    REDIS_URL: redis://redis:6379/0
    # In Docker, tasks go to the real Celery worker, whatever .env says.
    CELERY_TASK_ALWAYS_EAGER: "False"
    DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
    DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}

  volumes: [./backend:/app]
  # Lets containers reach services on your computer, e.g. LLM_BASE_URL=http://host.docker.internal:11434
  extra_hosts: ["host.docker.internal:host-gateway"]

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: junction
      POSTGRES_USER: junction
      POSTGRES_PASSWORD: junction
    # Host port 5433 avoids clashing with a local Postgres; containers use db:5432.
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U junction -d junction"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7
    ports: ["6380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  setup:
    <<: *backend
    command: python manage.py bootstrap
    depends_on:
      db: {condition: service_healthy}

  web:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8000
    ports: ["8000:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *backend
    command: celery -A config worker -l info
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  beat:
    <<: *backend
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      setup: {condition: service_completed_successfully}
      redis: {condition: service_healthy}


  # Reader app (React + Vite, frontend/). http://localhost:5173, live reload on save.
  frontend:
    image: node:24-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      # The browser (on your machine) calls the API, so this is the host-side address.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # container's own packages, not the host's
    ports: ["5173:5173"]
    depends_on:
      web: {condition: service_started}

volumes:
  pgdata:
  frontend_node_modules:
